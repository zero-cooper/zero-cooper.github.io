resume_header_intro: "<p>
Ph.D. researcher with theoretical foundation and project experience in <strong>multi-agent learning</strong>. Open to collaborations on scalable multi-agent systems.
</p>

<p>
I focus on 2 aspects of multi-agent learning: <strong>Learning Efficiency</strong> and <strong>Social Efficiency</strong>. The first concerns how much it costs to obtain an answer, and the second concerns how good the answer is in the system view. 
</p>
<p>
As a solution to multi-agent scalability issue, I am interested in <strong>online decentralized</strong> learning algorithms with <strong>theoretical guarantees</strong>. I am also keen on translating the theoretical advances into real-world applications. 
</p>
<p>
My research interests include: 
<ul>
  <li>Multi-agent (reinforcement) learning theory with networked info</li>
  <li>Game-theoretic learning for socially efficient cooperation</li>
  <li>Intelligent decision-making for smart-city transportation (e.g., next-generation scalable robotaxi services)</li>
</ul>
</p>"

